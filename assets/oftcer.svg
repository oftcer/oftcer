<svg xmlns="http://www.w3.org/2000/svg" width="420" height="96" viewBox="0 0 420 96">
  <defs>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-280" y1="0" x2="0" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.30"/>
      <animate attributeName="x1" values="-280;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;280" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.35"/>
    </filter>
  </defs>
  <text x="210" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#sweep)" filter="url(#glow)">Oftcer</text>
</svg>